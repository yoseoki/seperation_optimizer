[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seperation-optimizer"
version = "0.1.0"
description = "Layerwise subspace-based SGD optimizer for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x>=13"]
cuda13 = ["cupy-cuda13x>=14"]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
